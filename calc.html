<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="font-[Inter] min-h-screen overflow-hidden bg-cover bg-center bg-linear-[45deg,#1e211e,#3a4452]"
  >
    <div class="min-h-screen flex items-center justify-center px-4 py-1">
      <div
        class="w-[360px] sm:w-[390px] md:w-[420px] p-6 sm:p-7 select-none bg-black/20 backdrop-blur-xl rounded-3xl border-2 rounded-xl border-white/10"
      >
        <h2
          class="text-center text-white/70 text-xl sm:text-2xl font-bold tracking-[0.25em] cursor-default select-none mb-3"
        >
          CODE X CALC <sub class="text-xl text-white/80">©</sub>
        </h2>

        <div class="bg-transparent mb-6">
          <input
            aria-label="Calculator Display"
            inputmode="decimal"
            autocomplete="off"
            placeholder="0"
            type="text"
            name=""
            id="display"
            class="w-full bg-black/20 text-white/90 text-right text-xl sm:text-2xl font-bold rounded-xl outline-none border border-[#717377] py-4 px-5 shadow-inner placeholder:text-white/40"
          />
        </div>
        <div
          class="grid grid-cols-4 gap-4 w-full text-xl sm:text-2xl font-semibold font-sans"
        >
          <button
            aria-label="Clear display"
            class="p-3 shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer text-[#6dee0a] hover:scale-95 active:scale-90 transition-all duration-300 ease-in-out hover:-rotate-3 hover:shadow-[0_0_20px_#fb7c14]"
            onclick="clearDisplay('C')"
            type="button"
          >
            C
          </button>
          <button
            class="p-3 shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer text-[#6dee0a] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('%')"
            type="button"
          >
            %
          </button>
          <button
            class="p-3 shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer text-[#6dee0a] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('/')"
            type="button"
          >
            /
          </button>
          <button
            aria-label="Delete last character"
            class="p-3 shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer text-[#6dee0a] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="Backspace('DEL')"
            type="button"
          >
            DEL
          </button>

          <button
            class="p-3 text-[#ffffff] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('7')"
            type="button"
          >
            7
          </button>
          <button
            class="p-3 text-[#ffffff] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('8')"
            type="button"
          >
            8
          </button>
          <button
            class="p-3 text-[#ffffff] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('9')"
            type="button"
          >
            9
          </button>
          <button
            class="p-3 text-[#6dee0a] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('+')"
            type="button"
          >
            +
          </button>

          <button
            class="p-3 text-[#ffffff] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('4')"
            type="button"
          >
            4
          </button>
          <button
            class="p-3 text-[#ffffff] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('5')"
            type="button"
          >
            5
          </button>
          <button
            class="p-3 text-[#ffffff] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('6')"
            type="button"
          >
            6
          </button>
          <button
            class="p-3 text-[#6dee0a] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('-')"
            type="button"
          >
            -
          </button>

          <button
            class="p-3 text-[#ffffff] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('1')"
            type="button"
          >
            1
          </button>
          <button
            class="p-3 text-[#ffffff] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('2')"
            type="button"
          >
            2
          </button>
          <button
            class="p-3 text-[#ffffff] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('3')"
            type="button"
          >
            3
          </button>
          <button
            class="p-3 text-[#6dee0a] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('*')"
            type="button"
          >
            *
          </button>

          <button
            class="p-3 text-[#6dee0a] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('.')"
            type="button"
          >
            .
          </button>
          <button
            class="p-3 text-[#ffffff] bg-transparent border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 hover:bg-black/20 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] hover:scale-95 active:scale-90 hover:shadow-[0_0_20px_#fb7c14] transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="addToDisplay('0')"
            type="button"
          >
            0
          </button>
          <button
            aria-label="Calculate"
            class="p-3 hover:bg-orange-600 text-[#ffffff] border-none rounded-full w-14 h-14 sm:w-16 sm:h-16 cursor-pointer shadow-[-8px_-8px_15px_rgba(255,255,255,0.1)] bg-[#fb7c14] hover:scale-95 active:scale-90 transition-all duration-300 ease-in-out hover:-rotate-3"
            onclick="calculate('=')"
            type="button"
          >
            =
          </button>
        </div>
        <footer
          class="mt-5 text-center text-[11px] text-white/35 tracking-wide select-none"
        >
          Built with HTML • Tailwind CSS • JavaScript
        </footer>
      </div>
    </div>

    <script src="calc.js"></script>
  </body>
</html>
